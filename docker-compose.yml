# Meridian — local development stack.
#
#   make up      brings all of this up
#   make ready   blocks until /readyz reports every dependency healthy
#
# `version:` is omitted deliberately — Compose v2 ignores it and warns.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura_sdg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura_sdg"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Azure Blob Storage, locally, with no cloud account and no credentials.
  # Azurite speaks the real Blob API, so STORAGE_BACKEND=azure exercises the
  # same code path here, in CI and in production — the only difference is the
  # connection string. The alternative is an Azure path that first meets
  # reality after deployment.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      # Azurite has no shell utilities beyond node, so probe with node itself.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').request({host:'127.0.0.1',port:10000,path:'/devstoreaccount1?comp=list'},r=>process.exit(0)).on('error',()=>process.exit(1)).end()",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    ports:
      - "8000:8000"
    # `make up` guarantees this exists (copied from .env.example on a first
    # clone). The short form is used deliberately: the path:/required: form
    # needs Compose v2.24+, and a stranger's Docker install is not something
    # this project gets to choose.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aura:aura@postgres:5432/aura_sdg
      LOG_LEVEL: INFO
      CHROMA_PERSIST_DIR: /app/data/chroma
      # The startup sweep of the whole collection is an optimisation that has
      # been OOM-killed on constrained machines; off by default for dev.
      WARM_FRAMEWORK_COUNTS: "0"
      # Defaults to filesystem, which is byte-for-byte the previous
      # behaviour. Set STORAGE_BACKEND=azure in .env to route uploads to
      # Azurite instead; the connection string below is Azurite's published
      # development credential, identical on every machine and not a secret.
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    volumes:
      # Live code for hot reload. The virtualenv lives at /opt/venv precisely
      # so this mount cannot shadow it.
      - ./backend:/app
      # Named volumes, so an uploaded PDF or the index survives `make down`.
      # Without these a restart loses user data — two instances also cannot
      # share it, which is what the storage interface addresses next.
      - chroma_data:/app/data/chroma
      - uploads_data:/app/data/uploads
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        # Liveness, not readiness: the frontend renders fine while the API is
        # still warming, and gating the whole stack on readiness would make
        # `make up` fail whenever the provider budget is spent.
        condition: service_started

volumes:
  pgdata:
  azurite_data:
  chroma_data:
  uploads_data:
