# Scrapes Meridian's /metrics. Kept alongside the dashboard so the whole
# observability stack is provisioned as code rather than clicked together.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: meridian-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: meridian
