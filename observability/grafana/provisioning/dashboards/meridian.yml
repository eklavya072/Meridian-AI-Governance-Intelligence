apiVersion: 1
providers:
  - name: meridian
    orgId: 1
    type: file
    disableDeletion: false
    # Reload from disk, so editing the committed JSON is the way to change
    # the dashboard — edits made in the UI are overwritten, deliberately.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
