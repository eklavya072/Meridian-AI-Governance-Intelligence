[project]
name = "meridian-backend"
version = "1.0.0"
description = "Meridian — evidence-linked AI governance policy analysis"
# No readme/license keys: package = false below, so nothing is built as a
# distribution, and pointing at ../README.md would break any build whose
# context does not include the repo root.
# Pinned, not a floor. requirements.txt pinned nothing transitively, so two
# installs a week apart could resolve different builds of chromadb or
# sentence-transformers and move a latency or quality number with no commit
# to explain it. The lockfile below is the reproducibility guarantee; this
# line makes sure it is resolved against one interpreter.
requires-python = ">=3.13,<3.14"

dependencies = [
    # Web
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    # Async DB
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.51",
    # Document parsing. python-magic reads the real content type; the upload
    # path must never trust an extension or a client-supplied MIME.
    "pypdf>=6.14.2",
    "python-magic>=0.4.27",
    # Vector store + embeddings
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    # Declared so [tool.uv.sources] below can pin where it comes from;
    # sentence-transformers is what imports it.
    "torch>=2.9.0",
    # LLM provider (Gemini).
    "google-genai>=2.13.0",
    # Brief export (PDF and DOCX).
    "reportlab>=5.0.0",
    "python-docx>=1.2.0",
    # Framework config (config/frameworks.yaml).
    "pyyaml>=6.0.3",
    # Structured logging
    "structlog>=26.1.0",
    # HTTP client for framework sync
    "httpx>=0.28.1",
    # Utils
    "python-dotenv>=1.2.2",
    "numpy>=2.5.1",
    "azure-storage-blob>=12.23.0",
    "prometheus-client>=0.21.0",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    # scripts/measure_verification.py reads stored analyses straight out of
    # Postgres; the app itself uses asyncpg.
    "psycopg2-binary>=2.9.10",
]

[tool.uv]
package = false

# CPU-only torch. The default PyPI wheel bundles the CUDA runtime (several GB
# of image and scan surface), and Meridian runs its embedding model on CPU.
# Linux resolves from PyTorch's CPU index; macOS wheels are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # The codebase deliberately uses long explanatory comment blocks above
    # non-obvious logic; reflowing them adds churn without adding clarity.
    "E501",
    # Several call sites bind a loop variable inside a closure intentionally
    # (dimension callbacks); flagging every one is noise.
    "B023",
    # zip(..., strict=): every site pairs vectors built together; raising
    # mid-analysis on a short one would be worse than the shorter zip.
    "B905",
    # (str, Enum) -> StrEnum changes __str__/__format__, and these enums are
    # stored as Postgres labels and in analysis JSON.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on structure, not style; unused imports there are usually a
# fixture being registered.
"tests/**" = ["F401", "B011"]
# main.py calls load_dotenv() before importing src/, whose modules read
# environment variables into constants at import time. B008 is the FastAPI
# dependency idiom (File(...), BackgroundTasks()).
"main.py" = ["E402", "B008"]
# The scripts set HF_HUB_OFFLINE before importing sentence-transformers, which
# reads it on import.
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
# The modules typed so far; the list widens as more are.
files = [
    "src/utils.py",
    "src/validation.py",
    "src/guardrails.py",
    "src/framework_library.py",
    "src/logging_config.py",
]
# Report only on the files listed above, not on the modules they import.
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
# Module names, not paths: a path source root puts the backend on the import
# path twice and chromadb's native extension refuses to load a second time.
source = ["src", "main"]
omit = ["tests/*", ".venv/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
